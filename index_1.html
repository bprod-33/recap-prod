<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Récap Prod</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9480f"><style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1c1b19;--mu:#77736b;--ln:#e4e1da;--ac:#d9480f;--acbg:#fff0e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--card:#222120;--tx:#efece6;--mu:#a09b91;--ln:#35332f;--ac:#ff8a4c;--acbg:#3a2418}}
:root[data-theme="dark"]{--bg:#171614;--card:#222120;--tx:#efece6;--mu:#a09b91;--ln:#35332f;--ac:#ff8a4c;--acbg:#3a2418}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wk{margin:26px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:600}
.day{margin:14px 0 6px;font-weight:700;font-size:14px}
.c{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;margin-bottom:8px;color:inherit;font:inherit;cursor:pointer}
.c:hover{border-color:var(--ac)}.m{color:var(--mu);font-size:13px}.t{font-weight:600;margin:2px 0}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--acbg);color:var(--ac);margin-left:6px;font-weight:600}
.b{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:9px;padding:8px 13px;font:inherit;cursor:pointer}
.p{background:var(--ac);border-color:var(--ac);color:#fff}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sh h2{margin:0 0 2px;font-size:20px}.r{margin-top:12px}.r small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.r div{white-space:pre-wrap}.bar{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
label{display:block;margin-top:10px;font-size:12px;color:var(--mu)}
input,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx)}
.ch{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}.ch button{font-size:12px;padding:3px 9px}

.err{padding:14px;border:1px solid var(--ac);border-radius:10px;background:var(--acbg)}</style></head>
<body><main><div class="top"><h1>Récap Prod</h1><button class="b" id="rf">↻</button></div><div id="root"><p class="m">Chargement…</p></div></main>
<script>
const $=id=>document.getElementById(id),root=$("root");
const H=["d","h","sp","t","st","te","ac","pr","sr","bi","fdr","url","nt"];
const L_={sr:"Sur place",te:"Technique",ac:"Accueil",pr:"Prix",bi:"Billetterie",nt:"Infos"};
const J=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"],M=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
let ev=[];
function parseCSV(t){
  t=t.replace(/^\uFEFF/,"");
  const first=t.split("\n")[0],sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?";":",";
  const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){r.push(c);c=""}
    else if(ch==="\n"){r.push(c);rows.push(r);r=[];c=""}
    else if(ch!=="\r")c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}
  return rows.slice(1).filter(r=>r.some(x=>x.trim())).map(r=>{const e={};H.forEach((k,i)=>e[k]=(r[i]||"").trim());
    const m=e.d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)e.d=m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");return e})
}
const dt=s=>new Date(s+"T12:00:00"),ddmm=s=>s.slice(8)+"/"+s.slice(5,7);
const mon=s=>{const x=dt(s);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toISOString().slice(0,10)};
const lab=s=>{const x=dt(s);return J[x.getDay()]+" "+x.getDate()+" "+M[x.getMonth()]};
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function render(){
  root.replaceChildren();
  const L=ev.map((e,i)=>({e,i})).filter(o=>/^\d{4}-\d\d-\d\d$/.test(o.e.d)).sort((a,b)=>a.e.d.localeCompare(b.e.d)||a.i-b.i);
  let w="",d="";
  L.forEach(({e,i})=>{
    const k=mon(e.d);
    if(k!==w){w=k;d="";const ws=L.filter(o=>mon(o.e.d)===k);root.append(el("div","wk","Semaine du "+ddmm(ws[0].e.d)+" au "+ddmm(ws[ws.length-1].e.d)))}
    if(e.d!==d){d=e.d;root.append(el("div","day",lab(d).toUpperCase()))}
    const c=el("button","c");c.onclick=()=>show(i);
    const t=el("div","t",e.t);
    if(/TBC|confirmer/i.test([e.t,e.te,e.ac].join(" ")))t.append(el("span","tag","à compléter"));
    c.append(el("div","m",[e.h,e.sp].filter(Boolean).join(" · ")),t);
    if(e.st)c.append(el("div","m",e.st));
    c.append(el("div","m","Voir les infos →"));root.append(c);
  });
}
function show(i){
  const e=ev[i],o=el("div","ov"),s=el("div","sh");o.append(s);o.onclick=x=>{if(x.target===o)o.remove()};
  s.append(el("h2","",e.t),el("div","m",lab(e.d)+" · "+[e.h,e.sp].filter(Boolean).join(" · ")));
  ["st","te","ac","pr","sr","bi","nt"].forEach(k=>{if(!e[k])return;const r=el("div","r");r.append(el("small","",L_[k]||"Style"),el("div","",e[k]));s.append(r)});
  const bar=el("div","bar");
  if(e.fdr||e.url){const r=el("div","r");r.append(el("small","","FDR"),el("div","",e.fdr||"Fichier lié"));s.append(r);
    if(/^https?:\/\//.test(e.url)){const a=el("a","b p","📄 Ouvrir la FDR");a.href=e.url;a.target="_blank";a.rel="noopener";a.style.textDecoration="none";bar.append(a)}}
  const x=el("button","b","Fermer");x.onclick=()=>o.remove();bar.append(x);s.append(bar);root.append(o);
}
async function load(){
  try{const r=await fetch("events.csv?t="+Date.now());if(!r.ok)throw new Error(r.status);ev=parseCSV(await r.text());render()}
  catch(err){root.replaceChildren(el("div","err","Impossible de charger events.csv ("+err.message+"). Si tu ouvres le fichier directement depuis ton ordinateur, passe plutôt par l'adresse GitHub Pages."))}
}
$("rf").onclick=load;load();
</script></body></html>
